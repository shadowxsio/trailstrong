name: CodeQL (analyse de sécurité)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3" # mercredi 5h41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Dépôt privé : CodeQL doit pouvoir lire l'état du workflow.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Le code de l'app uniquement (pas les dépendances ni le build).
          config: |
            paths:
              - src
              - public
              - vite.config.ts
              - .github/workflows
            paths-ignore:
              - public/catalog.json
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
