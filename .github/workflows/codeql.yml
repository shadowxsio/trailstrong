name: CodeQL (analyse de sécurité)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3" # mercredi 5h41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Dépôt privé : CodeQL doit pouvoir lire l'état du workflow.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: ${{ matrix.language }}
          # Le code de l'app uniquement (pas les dépendances ni le build).
          config: |
            paths:
              - src
              - public
              - vite.config.ts
              - .github/workflows
            paths-ignore:
              - public/catalog.json
          queries: security-extended
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          category: /language:${{ matrix.language }}
