name: CodeQL (analyse de sécurité)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3" # mercredi 5h41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Le code de l'app uniquement (pas les dépendances ni le build).
          config: |
            paths:
              - src
              - public
              - vite.config.ts
              - .github/workflows
            paths-ignore:
              - public/catalog.json
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
