name: Security audit

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # lundi 6h17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Échoue sur toute vulnérabilité « high » ou « critical » des dépendances de prod.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
